name: CD Mobile (EAS Build)

on:
  push:
    branches:
      - main

jobs:
  build-apk:
    name: Gerar APK de Producao
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositorio
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Expo e EAS
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }} # Você precisará gerar esse token no site do Expo e salvar no GitHub Secrets

      - name: Instalar Dependencias
        run: npm ci

      - name: Gerar Build Android
        run: eas build --platform android --profile production --non-interactive